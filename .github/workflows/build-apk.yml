name: Auto Build & Release APK

on:
  push:
    branches: [ "main", "master", "dev" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          # Required by app/build.gradle.kts signingConfigs.debugConfig
          # (storeFile = file("${rootDir}/debug.keystore"))
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK outputs
        id: prepare_apks
        run: |
          mkdir -p release-apks
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Find and copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -type f -name '*.apk' | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release-apks/Purrfect-debug-${SHORT_SHA}.apk"
            echo "Copied debug APK"
          fi
          
          # Find and copy release APK (signed with debugConfig for universal installation)
          RELEASE_APK=$(find app/build/outputs/apk/release/ -type f -name '*.apk' | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "release-apks/Purrfect-release-${SHORT_SHA}.apk"
            echo "Copied release APK"
          fi
          
          ls -la release-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Purrfect-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" == "main" || "$TAG_NAME" == "master" ]]; then
            TAG_NAME="latest"
            gh release delete latest -y --repo "${{ github.repository }}" || true
            git tag -f latest "${{ github.sha }}"
            git push -f origin latest || true
          fi
          
          RELEASE_TITLE="Purrfect ${TAG_NAME}"
          gh release create "${TAG_NAME}" release-apks/*.apk \
            --repo "${{ github.repository }}" \
            --title "${RELEASE_TITLE}" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --generate-notes || gh release upload "${TAG_NAME}" release-apks/*.apk --clobber --repo "${{ github.repository }}"
